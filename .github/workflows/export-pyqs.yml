name: Export PYQs

# Run from the GitHub website:
#   Actions tab -> "Export PYQs" -> "Run workflow" -> pick filters -> Run
# Then open the finished run and download the "pyq-export-…" artifact (a zip
# with pyqs.xlsx — Prelims + Mains sheets — plus full-fidelity JSON).
# Requires repository secrets:
#   NEXT_PUBLIC_SUPABASE_URL  = https://<your-project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY = <your service role key>

on:
  workflow_dispatch:
    inputs:
      commission:
        description: Commission
        type: choice
        options: [all, appsc, tgpsc]
        default: all
      group:
        description: Exam group
        type: choice
        options: [all, '1', '2']
        default: all
      stage:
        description: Stage
        type: choice
        options: [both, prelims, mains]
        default: both
      only_answered:
        description: Mains — only questions that have a model answer
        type: boolean
        default: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPORT_COMMISSION: ${{ inputs.commission }}
      EXPORT_GROUP: ${{ inputs.group }}
      EXPORT_STAGE: ${{ inputs.stage }}
      EXPORT_ONLY_ANSWERED: ${{ inputs.only_answered }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify secrets are set
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing repository secrets NEXT_PUBLIC_SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase is reachable
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -m 25 \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" || echo "000")
          echo "Supabase REST status: $code"
          if [ "$code" = "521" ] || [ "$code" = "000" ] || [ "$code" = "503" ]; then
            echo "::error::Supabase is not responding (HTTP $code). If the project is paused, restore it in the Supabase dashboard and re-run."
            exit 1
          fi

      - name: Export PYQs
        run: node scripts/export-pyqs.mjs

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyq-export-${{ inputs.commission }}-group-${{ inputs.group }}-${{ inputs.stage }}${{ inputs.only_answered && '-answered' || '' }}
          path: export/
          if-no-files-found: error
